name: Build Android LAN Gateway APK

on:
  push:
    branches: [ build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: |
          npm config set legacy-peer-deps true
          npm i
          npm --prefix build/android install

      - name: Build electerm web/backend for Android
        env:
          SERVER_SECRET: lan-gateway-ci-build-secret
        run: npm run build:android

      - name: Create and sync Android project
        run: |
          cd build/android
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: Configure Android project
        run: |
          cd build/android/android
          grep -q "nodejsMobileVersion" variables.gradle || printf '\next.nodejsMobileVersion = "18.20.4-capawesome.1"\n' >> variables.gradle
          cd ../../..
          cp build/android/res-overlay/AndroidManifest.xml build/android/android/app/src/main/AndroidManifest.xml
          mkdir -p build/android/android/app/src/main/java
          cp -r build/android/res-overlay/java/. build/android/android/app/src/main/java/
          cp -r build/android/res-overlay/. build/android/android/app/src/main/res/
          rm -rf build/android/android/app/src/main/res/java
          RES=build/android/android/app/src/main/res
          rm -f "$RES/drawable-v24/ic_launcher_foreground.xml"
          rm -f "$RES/values/ic_launcher_background.xml"
          find "$RES" -type f -name 'splash.png' -path '*/drawable*' -delete

      - name: Build debug APK
        run: |
          cd build/android/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p out
          cp build/android/android/app/build/outputs/apk/debug/app-debug.apk out/electerm-android-lan-gateway.apk
          sha256sum out/electerm-android-lan-gateway.apk > out/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: electerm-android-lan-gateway
          path: out/*
          if-no-files-found: error
          retention-days: 30
